<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>문의함 — 작은 초록</title>
  <style>
    [hidden] { display: none !important; }
    :root { --bg: #fbf6ee; --paper: #fffdf9; --ink: #3b2f26; --ink-2: #6e5f52; --line: #e6d9c6; --accent: #c0643d; --green: #4f6f4a; --err: #b23b2a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, 'Malgun Gothic', sans-serif; font-size: 16px; line-height: 1.6; }
    main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 20px; margin: 0 0 16px; color: var(--green); }
    .login { display: grid; gap: 12px; background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
    input { font: inherit; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
    button { font: inherit; border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; min-height: 44px; }
    .primary { background: var(--accent); color: #fff; font-weight: 700; }
    .err { color: var(--err); margin: 0; min-height: 1.4em; }
    .count { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px 20px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .count b { font-size: 36px; color: var(--accent); line-height: 1; }
    .bar { display: flex; gap: 8px; margin-bottom: 12px; }
    .bar button { background: var(--paper); border: 1px solid var(--line); }
    .list { display: grid; gap: 12px; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .card.new { border-left: 5px solid var(--accent); }
    .meta { color: var(--ink-2); font-size: 14px; }
    .name { font-weight: 700; font-size: 18px; }
    .contact { background: none; padding: 0; min-height: 0; color: var(--green); text-decoration: underline; font-size: 17px; }
    .msg { margin: 6px 0 12px; }
    .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .status button { background: var(--bg); border: 1px solid var(--line); }
    .status button.on { background: var(--green); color: #fff; border-color: var(--green); font-weight: 700; }
    .empty { text-align: center; color: var(--ink-2); padding: 32px 0; }
  </style>
</head>
<body>
  <main>
    <h1>작은 초록 · 문의함</h1>

    <form class="login" id="login">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">들어가기</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>

    <section id="box" hidden>
      <div class="count"><span>새 문의</span><b id="newCount">0</b></div>
      <div class="bar">
        <button id="reload" type="button">새로고침</button>
        <button id="logout" type="button">나가기</button>
      </div>
      <p class="err" id="boxErr" role="alert"></p>
      <div class="list" id="list"></div>
    </section>
  </main>

  <script>
    const STATUSES = ['새 문의', '연락함', '완료'];
    const $ = (id) => document.getElementById(id);
    const KEY = 'admin-pw';
    const getPw = () => sessionStorage.getItem(KEY) || '';

    async function api(method, body) {
      const r = await fetch('/api/admin', {
        method,
        headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { showLogin('비밀번호가 맞지 않아요.'); throw new Error(''); }
      if (!r.ok) throw new Error(d.error || '불러오지 못했어요.');
      return d;
    }

    function showLogin(err) {
      sessionStorage.removeItem(KEY);
      $('box').hidden = true; $('login').hidden = false;
      $('loginErr').textContent = err || '';
      $('pw').value = ''; $('pw').focus();
    }

    const fmt = (s) => new Date(s).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

    function render(rows) {
      $('newCount').textContent = rows.filter((r) => r.status === '새 문의').length;
      const list = $('list'); list.textContent = '';
      if (!rows.length) { list.innerHTML = '<p class="empty">아직 들어온 문의가 없어요.</p>'; return; }
      for (const row of rows) {
        const c = document.createElement('article');
        c.className = 'card' + (row.status === '새 문의' ? ' new' : '');
        const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(row.created_at);
        const name = document.createElement('div'); name.className = 'name'; name.textContent = row.name;
        const contact = document.createElement('button'); contact.className = 'contact'; contact.type = 'button';
        contact.textContent = row.contact; contact.title = '눌러서 복사';
        contact.onclick = async () => {
          try { await navigator.clipboard.writeText(row.contact); contact.textContent = row.contact + ' (복사됨)'; setTimeout(() => contact.textContent = row.contact, 1500); }
          catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
        };
        const msg = document.createElement('p'); msg.className = 'msg'; msg.textContent = row.message || '';
        const st = document.createElement('div'); st.className = 'status';
        for (const s of STATUSES) {
          const b = document.createElement('button'); b.type = 'button'; b.textContent = s;
          if (row.status === s) b.className = 'on';
          b.onclick = async () => {
            try { await api('PATCH', { id: row.id, status: s }); load(); }
            catch (e) { if (e.message) $('boxErr').textContent = e.message; }
          };
          st.append(b);
        }
        c.append(meta, name, contact, msg, st);
        list.append(c);
      }
    }

    async function load() {
      $('boxErr').textContent = '';
      try {
        const d = await api('GET');
        $('login').hidden = true; $('box').hidden = false;
        render(d.rows || []);
      } catch (e) {
        if (e.message) { if ($('box').hidden) $('loginErr').textContent = e.message; else $('boxErr').textContent = e.message; }
      }
    }

    $('login').addEventListener('submit', (e) => {
      e.preventDefault();
      sessionStorage.setItem(KEY, $('pw').value);
      load();
    });
    $('reload').onclick = load;
    $('logout').onclick = () => showLogin('');
    if (getPw()) load(); else $('pw').focus();
  </script>
</body>
</html>
